services:
  - type: web
    name: apcm-whatsapp
    env: node
    buildCommand: pnpm install --prod --no-frozen-lockfile && pnpm --filter backend build
    startCommand: cd apps/backend && pnpm exec medusa db:migrate && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
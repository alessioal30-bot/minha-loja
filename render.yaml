services:
  - type: web
    name: apcm-whatsapp
    env: node
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter backend build
    startCommand: pnpm --filter backend db:migrate && pnpm --filter backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
